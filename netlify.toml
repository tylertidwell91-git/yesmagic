# Netlify config for YESMagic (Vite + React SPA + serverless API)
[build]
  # Inject SPELLBOOK_* into public/spellbook/config.js before Vite copies public/ → dist/
  command = "node scripts/inject-spellbook-config.cjs && vite build"
  publish = "dist"
  functions = "netlify/functions"

# API routes → serverless functions (must come before SPA catch-all)
[[redirects]]
  from = "/api/create-payment-intent"
  to = "/.netlify/functions/create-payment-intent"
  status = 200
  force = true
[[redirects]]
  from = "/api/order"
  to = "/.netlify/functions/order"
  status = 200
  force = true
[[redirects]]
  from = "/api/inventory"
  to = "/.netlify/functions/inventory"
  status = 200
  force = true
[[redirects]]
  from = "/api/shows"
  to = "/.netlify/functions/shows"
  status = 200
  force = true
[[redirects]]
  from = "/api/sync-whatnot-shows"
  to = "/.netlify/functions/sync-whatnot-shows"
  status = 200
  force = true
[[redirects]]
  from = "/api/whatnot-shows"
  to = "/.netlify/functions/whatnot-shows"
  status = 200
  force = true
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true
[[redirects]]
  from = "/api/admin-auth"
  to = "/.netlify/functions/admin-auth"
  status = 200
  force = true
[[redirects]]
  from = "/api/shipping-rules"
  to = "/.netlify/functions/shipping-rules"
  status = 200
  force = true
[[redirects]]
  from = "/api/order-confirmation"
  to = "/.netlify/functions/order-confirmation"
  status = 200
  force = true
[[redirects]]
  from = "/api/email-subscribers"
  to = "/.netlify/functions/email-subscribers"
  status = 200
  force = true
[[redirects]]
  from = "/api/email-broadcast"
  to = "/.netlify/functions/email-broadcast"
  status = 200
  force = true
[[redirects]]
  from = "/api/reply-note"
  to = "/.netlify/functions/reply-note"
  status = 200
  force = true

# Spellbook (public/spellbook/index.html): subdomain + short path on primary domain.
# Root URL must be explicit: "/*" alone does not match path "/". Do not re-add
# public/_redirects with /* → index.html — Netlify applies _redirects BEFORE this
# file and it would override these rules on every hostname.
[[redirects]]
  from = "https://spellbook.yesmagicshop.com/"
  to = "/spellbook/index.html"
  status = 200
  force = true
# No force: real files under dist/spellbook/ (e.g. config.js) must be served.
# force=true on /* was rewriting /spellbook/config.js to index.html, so Supabase
# env baked into config.js never loaded and the app showed "missing configuration".
[[redirects]]
  from = "https://spellbook.yesmagicshop.com/*"
  to = "/spellbook/index.html"
  status = 200
[[redirects]]
  from = "http://spellbook.yesmagicshop.com/"
  to = "/spellbook/index.html"
  status = 200
  force = true
[[redirects]]
  from = "http://spellbook.yesmagicshop.com/*"
  to = "/spellbook/index.html"
  status = 200
[[redirects]]
  from = "/spellbook"
  to = "/spellbook/index.html"
  status = 200
  force = true

# SPA fallback: serve index.html for all other routes (/admin, /checkout, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
