# Netlify config for YESMagic (Vite + React SPA + serverless API)
[build]
  # Inject SPELLBOOK_* into public/spellbook/config.js before Vite copies public/ → dist/
  command = "node scripts/inject-spellbook-config.cjs && vite build"
  publish = "dist"
  functions = "netlify/functions"

# Spellbook (public/spellbook/index.html): subdomain + short path on primary domain.
# Root URL must be explicit: "/*" alone does not match path "/". Do not re-add
# public/_redirects with /* → index.html — Netlify applies _redirects BEFORE this
# file and it would override these rules on every hostname.
[[redirects]]
  from = "https://spellbook.yesmagicshop.com/"
  to = "/spellbook/index.html"
  status = 200
  force = true
# No force: real files under dist/spellbook/ (e.g. config.js) must be served.
# force=true on /* was rewriting /spellbook/config.js to index.html, so Supabase
# env baked into config.js never loaded and the app showed "missing configuration".
[[redirects]]
  from = "https://spellbook.yesmagicshop.com/*"
  to = "/spellbook/index.html"
  status = 200
[[redirects]]
  from = "http://spellbook.yesmagicshop.com/"
  to = "/spellbook/index.html"
  status = 200
  force = true
[[redirects]]
  from = "http://spellbook.yesmagicshop.com/*"
  to = "/spellbook/index.html"
  status = 200
[[redirects]]
  from = "/spellbook"
  to = "/spellbook/index.html"
  status = 200
  force = true

# SPA fallback: serve index.html for all other routes (/admin, /checkout, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
