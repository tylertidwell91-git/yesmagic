# Netlify config for YESMagic (Vite + React SPA + serverless API)
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API routes → serverless functions (must come before SPA catch-all)
[[redirects]]
  from = "/api/create-payment-intent"
  to = "/.netlify/functions/create-payment-intent"
  status = 200
  force = true
[[redirects]]
  from = "/api/order"
  to = "/.netlify/functions/order"
  status = 200
  force = true
[[redirects]]
  from = "/api/inventory"
  to = "/.netlify/functions/inventory"
  status = 200
  force = true
[[redirects]]
  from = "/api/shows"
  to = "/.netlify/functions/shows"
  status = 200
  force = true

# SPA fallback: serve index.html for all other routes (/admin, /checkout, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
